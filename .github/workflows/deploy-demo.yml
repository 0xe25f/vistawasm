name: Deploy demo to GitHub Pages

# Builds the WASM package and the TypeScript wrapper, copies the compiled
# output into demo/dist (see scripts/build-demo.mjs), then publishes the
# demo/ folder as a static site. The published site is plain HTML/JS/wasm
# with no build step of its own — Node and Rust are only used here, in CI,
# to produce that static output.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; queued runs that land while one is
# already in progress are skipped rather than queued, since only the most
# recent commit's build should ever end up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the WASM package, TypeScript wrapper, and demo
        run: npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo/ as the Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
