name: Deploy the site to GitHub Pages

# Builds the WASM package and the TypeScript wrapper, copies the compiled
# output into demo/dist (see scripts/build-demo.mjs), then assembles the
# site in _site/ (see scripts/build-site.mjs): the front page, the three.js
# and Babylon.js guides, the API reference, and the demo at demo/. The
# published site is plain HTML/JS/wasm with no build step of its own; Node
# and Rust are only used here, in CI, to produce that static output.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the build job only reads the repository; the deploy
# job alone may publish to Pages.
permissions:
  contents: read

# Only one concurrent deployment; queued runs that land while one is
# already in progress are skipped rather than queued, since only the most
# recent commit's build should ever end up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Every check in checks.yml must pass first, so a red check never
  # deploys.
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Third-party actions are pinned to a full commit SHA.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # An exact version, so the WASM glue and wasm-opt do not change
          # under us. Keep it in step with docs/testing-and-contributing.md.
          version: v0.15.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # The current Node LTS release.
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the WASM package, TypeScript wrapper, demo and site
        run: npm run build:site

      - name: Upload _site/ as the Pages artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
