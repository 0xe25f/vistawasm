[workspace]
members = [
  "crates/vista_types",
  "crates/vista_wasm"
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/0xe25f/vistawasm"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
vista_types = { path = "crates/vista_types" }



# Release builds favour a small download. Link-time optimisation over one
# codegen unit lets LLVM inline and prune across crates, and WASM cannot
# unwind, so aborting drops the unused unwinding tables. Measured after
# `wasm-opt -O3`: 582 KB (225 KB gzip) against 613 KB (236 KB gzip) at
# `opt-level = 3`. The heavy work runs on the GPU, so the CPU-side speed
# difference is small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
