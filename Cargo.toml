[workspace]
members = [
  "crates/vista_types",
  "crates/vista_wasm"
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/0xe25f/vistawasm"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
vista_types = { path = "crates/vista_types" }
