[package]
name = "vista_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust and WebAssembly terrain engine for modern browsers with WebGPU."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true
vista_types.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = "30"
web-sys = { version = "0.3", features = [
  "Blob",
  "CanvasRenderingContext2d",
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Navigator",
  "Performance",
  "Window"
] }

[dev-dependencies]
futures-executor = "0.3"
naga = { version = "30", features = ["wgsl-in"] }

# wasm-opt as wasm-pack runs it by default, plus two facts about this
# module that let it fold more: its memory is its own, so it starts
# zeroed and zero bytes need not be stored, and the stack comes first
# and grows down from 1 MiB, so the lowest 1 KiB is never used (a stack
# that deep has already overflowed), and constant offsets can be folded
# into loads and stores without a wrapped address reaching it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--zero-filled-memory", "--low-memory-unused"]
